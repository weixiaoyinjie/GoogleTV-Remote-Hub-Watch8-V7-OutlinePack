name: Build Google TV Remote Watch8 V7 OutlinePack APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -f "$SDK/platforms/android-35/android.jar" ] && [ -x "$SDK/build-tools/35.0.0/aapt2" ]; then
            echo "Android SDK 35 already installed"
          else
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$MANAGER" ]; then
              MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
            fi
            test -x "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" --licenses < <(yes)
            "$MANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Unpack one-upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GoogleTV-Remote-Hub-Watch8-V7-OutlinePack-OneUpload.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          mkdir -p "$RUNNER_TEMP/watch8"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/watch8"
          SETTINGS=$(find "$RUNNER_TEMP/watch8" -type f -name settings.gradle -print -quit)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Test round geometry
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$RUNNER_TEMP/geometry-test"
          javac -d "$RUNNER_TEMP/geometry-test" app/src/main/java/com/cecbridge/remotev2/RoundPanelGeometry.java tests/GeometryTest.java
          java -cp "$RUNNER_TEMP/geometry-test" com.cecbridge.remotev2.GeometryTest

      - name: Build Wear OS APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/watch8-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-Remote-Hub-Watch8-V7-OutlinePack-APK
          path: watch8-debug.apk
          if-no-files-found: error
